# Runs on every push and pull request. A red X on GitHub means a test failed or the RTL
# didn't compile; click it to see the log.
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # third_party/riscv-tests

      - name: Install simulators, synthesis tools, and the RISC-V compiler
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys gcc-riscv64-unknown-elf

      - name: Install sv2v (SV -> Verilog for Yosys)
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          mkdir -p "$HOME/.local/bin"
          unzip -j sv2v.zip sv2v-Linux/sv2v -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Unit tests (Icarus)
        run: make test

      - name: Unit tests (Verilator)
        run: make test SIM=verilator

      - name: Programs, 5-stage pipeline and dual-issue (Icarus + Verilator)
        run: |
          # (one make per line: bash -e stops at the first failure)
          for c in 1 2; do for p in hello bench hazards dual jalr_lsb bp muldiv mlp; do
            make prog-$p CORE=$c
            make prog-$p CORE=$c SIM=verilator
          done; done

      - name: Performance floor (lockstep can't see a predictor that predicts badly)
        run: |
          make prog-bench CORE=2 SIM=verilator PLUSARGS=+min_ipc=1.05

      - name: Official RISC-V tests, rv32ui + rv32um, both pipelines (Icarus + Verilator)
        run: |
          for c in 1 2; do
            make isa CORE=$c
            make isa CORE=$c SIM=verilator
          done

      - name: Synthesis, both pipelines, the systolic array and the DMA (fails on inferred latches)
        run: |
          make synth SYNTH_TOP=core
          make synth SYNTH_TOP=core_dual
          make synth SYNTH_TOP=systolic
          make synth SYNTH_TOP=dma
