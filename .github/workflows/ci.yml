# Runs on every push and pull request. A red X on GitHub means a test failed or the RTL
# didn't compile; click it to see the log.
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator and synthesis tools
        # Week 7: add gcc-riscv64-unknown-elf here and a step that runs `make prog-hello`
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys

      - name: Install sv2v (SV -> Verilog for Yosys)
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -j sv2v.zip sv2v-Linux/sv2v -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cocotb
        run: pip install -r requirements.txt

      - name: Unit tests
        run: make test

      - name: Synthesis (fails on inferred latches)
        run: make synth
